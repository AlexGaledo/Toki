# url=http://127.0.0.1:11071/ title="Toki" dialogs=["Settings"]
- status:
  - text: Cube Test created with a team of 3
  - button "Dismiss"
- dialog "Settings":
  - button "Close"
  - complementary:
    - heading "Settings" [level=2]
    - tablist "Settings sections":
      - tab "Account"
      - tab "Security"
      - tab "Claude"
      - tab "Bots"
      - tab "Projects" [selected]
      - tab "Tools"
      - tab "Game tools"
      - tab "Reports"
      - tab "Connections"
      - tab "Logins"
      - tab "Knowledge"
      - tab "Devices"
      - tab "PC runner"
      - tab "Notifications"
      - tab "Appearance"
      - tab "About"
  - tabpanel "Projects":
    - banner:
      - heading "Projects" [level=2]
      - paragraph: Shared folders. Only the bots you list here can work in a project's folder.
    - heading "New project" [level=3]
    - text: Name
    - textbox "Name":
      - /placeholder: Wika
    - text: Team
    - radiogroup "Team":
      - radio "None" [checked]: None Just the shared folder. Give bots access to it below.
      - radio "Dev team": Dev team Adds a lead, an engineer and a quality engineer, with a group chat.
      - radio "Game team": Game team Adds a lead, a Roblox builder and a Blender artist, a group chat with game tools, game folders and git.
    - button "Create project" [disabled]
    - status:
      - paragraph: Cube Test is set up
      - list:
        - listitem: "Git: the project folder now keeps a history, starting with a first commit."
        - listitem: "Roblox Studio: its tools are on in the game chat. They work while Studio is open."
        - listitem: "Blender: starts headless for the game chat when a bot needs it, and never opens a window."
      - button "Done"
    - heading "Cube Test" [level=3]
    - text: Team template v1
    - button "Open the map of Cube Test": Map
    - button "Open project Cube Test": Open project
    - paragraph: ~\AppData\Local\Temp\toki-verify-ui-gaps-run2\run\data\projects\cube-test
    - paragraph: Needs a look
    - list:
      - listitem: "current.md: Under 80 characters."
      - listitem: "features/README.md: No updated date."
    - group: 3 bots have access
    - group: Repos
